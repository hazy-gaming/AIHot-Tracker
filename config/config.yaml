# 目标网站配置
source:
  api_url: "https://aihot.virxact.com/api/public/items"
  rss_url: null  # 禁用 RSS，使用 API（字段更完整）
  default_mode: "selected"  # 使用精选模式，与网站精选页保持一致
  default_category: null

# 轮询配置
polling:
  base_interval: 60           # 基础间隔：1 分钟（更快）
  min_interval: 60            # 最小间隔：1 分钟
  max_interval: 300           # 最大间隔：5 分钟
  empty_threshold: 10         # 连续 10 次空轮询后延长间隔
  work_hours:
    start: 0
    end: 24
    interval: 60              # 全天 1 分钟间隔
  off_hours_interval: 180     # 非工作时间：3 分钟

# 推送配置
push:
  channels:
    feishu:
      enabled: true
      webhook_url: "${FEISHU_WEBHOOK_URL}"
      secret: "${FEISHU_WEBHOOK_SECRET}"
    wechat:
      enabled: false
      webhook_url: ""

# 消息配置
message:
  max_items_per_message: 10
  merge_threshold: 3
  include_summary: true
  include_source: true
  include_category: true

# 存储配置
storage:
  db_path: "./data/aihot_tracker.db"
  log_path: "./logs/aihot_tracker.log"
  backup_enabled: true
  backup_interval_days: 7

# 飞书多维表格配置
bitable:
  enabled: false
  app_id: "${BITABLE_APP_ID}"
  app_secret: "${BITABLE_APP_SECRET}"
  app_token: ""    # 多维表格 app_token，从表格 URL 中获取
  table_id: ""     # 数据表 table_id，从表格 URL 中获取
  field_mapping:   # Item 属性 → 多维表格字段名
    title: "标题"
    url: "链接"
    summary: "摘要"
    category: "分类"
    source: "来源"
    published_at: "发布时间"
